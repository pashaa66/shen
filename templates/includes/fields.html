{% for field in form %}
<div class="field">
  <label for="{{ field.id_for_label }}">
    {{ field.label }}{% if not field.field.required %} <small>(необязательно)</small>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<small class="help">{{ field.help_text|safe }}</small>{% endif %}
  {{ field.errors }}
</div>
{% endfor %}
